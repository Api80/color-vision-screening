<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="brandGradient" x1="170" y1="130" x2="850" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BC4A5"/>
      <stop offset="1" stop-color="#078675"/>
    </linearGradient>
    <radialGradient id="highlight" cx="0" cy="0" r="1" gradientTransform="translate(770 210) rotate(130) scale(390)">
      <stop stop-color="#FFFFFF" stop-opacity=".32"/>
      <stop offset=".72" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="32" stdDeviation="34" flood-color="#087B6C" flood-opacity=".22"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="72" y="72" width="880" height="880" rx="230" fill="url(#brandGradient)"/>
    <rect x="72" y="72" width="880" height="880" rx="230" fill="url(#highlight)"/>
    <rect x="78" y="78" width="868" height="868" rx="224" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="12"/>
  </g>

  <circle
    cx="485"
    cy="512"
    r="222"
    fill="none"
    stroke="#FFFAF0"
    stroke-width="92"
    stroke-linecap="round"
    stroke-dasharray="1160 235"
    transform="rotate(-42 485 512)"
  />

  <circle cx="746" cy="284" r="72" fill="#69C9DF" stroke="#FFFAF0" stroke-width="22"/>
  <circle cx="754" cy="742" r="58" fill="#F3AD52" stroke="#FFFAF0" stroke-width="20"/>
</svg>
